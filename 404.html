<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page not found | Armeet Narang</title>
  <meta name="robots" content="noindex" />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400&family=DM+Sans:wght@300;500&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{min-height:100vh;min-height:100svh;display:grid;place-items:center;padding:24px;background:#F9F6F1;color:#2A2420;font-family:'DM Sans',system-ui,sans-serif;font-weight:300;text-align:center;line-height:1.65}
    main{max-width:420px}
    h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:300;font-size:clamp(2.2rem,8vw,3rem);line-height:1.1;margin-bottom:12px}
    p{color:#6B5E54;margin-bottom:28px}
    a.btn{display:inline-block;padding:14px 28px;border-radius:100px;background:#2A2420;color:#fff;font-weight:500;font-size:.9rem;text-decoration:none}
    a.btn:focus-visible{outline:2px solid #4E6F42;outline-offset:3px}
    .alt{margin:20px 0 0;font-size:.9rem}
    .alt a{color:#4E6F42;font-weight:500}
  </style>
</head>
<body>
  <main>
    <h1>That page isn't here.</h1>
    <p>The link may be old or mistyped. The homepage has everything, including how to book.</p>
    <a class="btn" id="home" href="/">Go to the homepage</a>
    <p class="alt">Or message me on <a href="https://api.whatsapp.com/send?phone=918793318765">WhatsApp</a>.</p>
  </main>
  <script>
    // On github.io/<repo>/ the site root is /<repo>/, not /
    if (location.hostname.endsWith('github.io')) {
      var seg = location.pathname.split('/')[1];
      if (seg) document.getElementById('home').href = '/' + seg + '/';
    }
  </script>
</body>
</html>
