<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Book, pay &amp; policies | Armeet Narang</title>
  <meta name="description" content="Intake form, payment details, cancellation policy and clinic addresses for sessions with Armeet Narang, psychologist and psychotherapist in Pune." />
  <!-- This page is shared directly (Instagram bio, WhatsApp). Keeping it out of search so it never competes with the homepage. Remove this line to allow indexing. -->
  <meta name="robots" content="noindex, follow" />
  <link rel="canonical" href="https://armeetnarang.com/links" />

  <meta property="og:type"        content="website" />
  <meta property="og:url"         content="https://armeetnarang.com/links" />
  <meta property="og:title"       content="Book, pay &amp; policies | Armeet Narang" />
  <meta property="og:description" content="Intake form, payment details, cancellation policy and clinic addresses for sessions with Armeet Narang." />
  <meta property="og:image"       content="https://armeetnarang.com/images/og-image.png" />
  <meta property="og:site_name"   content="Armeet Narang" />
  <meta name="twitter:card"       content="summary_large_image" />

  <link rel="icon" type="image/x-icon" href="favicon.ico" />
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg" />
  <link rel="icon" type="image/png" sizes="96x96" href="favicon-96x96.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png" />
  <link rel="manifest" href="site.webmanifest" />
  <meta name="theme-color" content="#F9F6F1" />

  <script id="ga-script"></script>
  <script id="ga-init"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:     #F9F6F1;
      --warm:      #F2EDE4;
      --sand:      #E8DFD0;
      --sage:      #8FA882;
      --sage-ink:  #4E6F42;
      --text:      #2A2420;
      --text-mid:  #6B5E54;
      --text-soft: #72665D;
      --white:     #FFFFFF;
      --serif: 'Cormorant Garamond', Georgia, serif;
      --sans:  'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --ease:  0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    html { -webkit-text-size-adjust: 100%; }
    body {
      font-family: var(--sans); font-weight: 300; font-size: 16px; line-height: 1.65;
      color: var(--text); background: var(--cream);
      -webkit-font-smoothing: antialiased;
    }
    a { color: inherit; }
    :focus-visible { outline: 2px solid var(--sage-ink); outline-offset: 3px; border-radius: 6px; }

    .page { max-width: 540px; margin: 0 auto; padding: 48px 24px 72px; }

    /* ── Header ── */
    .head { text-align: center; }
    .portrait {
      width: 148px; height: 184px; margin: 0 auto 22px;
      border-radius: 100px 100px 84px 84px; overflow: hidden;
      background: var(--warm); border: 1px solid var(--sand);
    }
    .portrait picture, .portrait img { display: block; width: 100%; height: 100%; }
    .portrait img { object-fit: cover; object-position: 50% 30%; transform: scale(1.32); transform-origin: 50% 30%; }
    .name { font-family: var(--serif); font-weight: 300; font-size: 2.5rem; line-height: 1.1; letter-spacing: -0.01em; }
    .role { margin-top: 6px; font-size: 0.92rem; color: var(--text-mid); font-weight: 400; }
    .intro { margin: 14px auto 0; max-width: 380px; color: var(--text-mid); }

    /* ── Buttons ── */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%;
      padding: 15px 24px; border-radius: 100px; border: 1.5px solid transparent;
      font-family: var(--sans); font-size: 0.92rem; font-weight: 500; line-height: 1.2;
      text-decoration: none; cursor: pointer; transition: var(--ease);
    }
    .btn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .btn-primary { background: var(--text); color: var(--white); }
    .btn-primary:hover { background: #3d3530; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(42,36,32,.18); }
    .btn-sage { background: var(--sage-ink); color: var(--white); }
    .btn-sage:hover { background: #3F5C35; transform: translateY(-2px); }
    .btn-outline { background: transparent; color: var(--text); border-color: var(--sand); }
    .btn-outline:hover { background: var(--warm); border-color: var(--text-soft); }
    .actions { display: grid; gap: 12px; margin-top: 32px; }

    /* ── Sections ── */
    section { margin-top: 56px; padding-top: 40px; border-top: 1px solid var(--sand); }
    h2 { font-family: var(--serif); font-weight: 400; font-size: 1.85rem; line-height: 1.15; margin-bottom: 8px; }
    h3 { font-family: var(--sans); font-weight: 500; font-size: 1.02rem; line-height: 1.35; }
    p  { color: var(--text-mid); }
    .lede { margin-bottom: 28px; }

    /* ── Steps: intake, then payment (a real sequence, so numbered) ── */
    .steps { list-style: none; }
    .step { position: relative; padding-left: 54px; padding-bottom: 44px; }
    .step:last-child { padding-bottom: 0; }
    .step::before { content: ''; position: absolute; left: 15.5px; top: 40px; bottom: 8px; width: 1px; background: var(--sand); }
    .step:last-child::before { display: none; }
    .step-mark {
      position: absolute; left: 0; top: -2px; width: 32px; height: 32px; border-radius: 50%;
      background: var(--text); color: var(--white); display: grid; place-items: center;
      font-family: var(--serif); font-size: 1.15rem; font-weight: 500; line-height: 1;
    }
    .step h3 { font-size: 1.15rem; margin-bottom: 6px; padding-top: 2px; }
    .step > p { margin-bottom: 18px; font-size: 0.95rem; }
    .step .btn { width: 100%; }
    .step .pay-details { margin-bottom: 26px; }

    /* payment */
    .pay-sub { margin: 0 0 10px; }
    .upi-app-wrap[hidden] { display: none; }
    .upi-app-wrap { margin-bottom: 20px; }
    .upi-app-wrap .btn { margin-bottom: 10px; }
    .upi-app-wrap p { font-size: 0.85rem; color: var(--text-soft); }
    .qr { width: 300px; max-width: 100%; margin: 0 0 16px; border: 1px solid var(--sand); border-radius: 18px; overflow: hidden; background: #F1F5FE; }
    .qr img { display: block; width: 100%; height: auto; }
    .upi { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin: 0 0 20px; padding: 12px 14px 12px 16px; background: var(--white); border: 1px solid var(--sand); border-radius: 14px; }
    .upi-label { display: block; font-size: 0.78rem; color: var(--text-soft); font-weight: 400; }
    .upi-id { font-weight: 500; font-size: 0.95rem; color: var(--text); overflow-wrap: anywhere; }
    .upi-name { display: block; font-size: 0.82rem; color: var(--text-mid); }
    .copy { flex-shrink: 0; font: 500 0.82rem var(--sans); color: var(--sage-ink); background: var(--warm); border: 1px solid var(--sand); border-radius: 100px; padding: 8px 16px; cursor: pointer; transition: var(--ease); }
    .copy:hover { background: var(--sand); }

    .fees { list-style: none; margin: 0 0 30px; border-top: 1px solid var(--sand); }
    .fees li { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--sand); }
    .fees .fee-name { color: var(--text); font-weight: 400; font-size: 0.95rem; }
    .fees .fee-sub { display: block; font-size: 0.82rem; color: var(--text-soft); }
    .fees .fee-amt { font-family: var(--serif); font-size: 1.6rem; font-weight: 400; line-height: 1; white-space: nowrap; }
    /* bank transfer: collapsed by default, UPI is the main route */
    .bank { margin: 0 0 26px; background: var(--white); border: 1px solid var(--sand); border-radius: 14px; }
    .bank summary { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; font-weight: 500; font-size: 0.95rem; cursor: pointer; list-style: none; color: var(--text); }
    .bank summary::-webkit-details-marker { display: none; }
    .bank summary::after { content: '+'; font-size: 1.35rem; line-height: 1; color: var(--text-soft); transition: transform var(--ease); }
    .bank[open] summary::after { transform: rotate(45deg); }
    .bank-rows { padding: 0 16px 6px; }
    .bank-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 11px 0; border-top: 1px solid var(--sand); }
    .bank-row dt { font-size: 0.78rem; color: var(--text-soft); font-weight: 400; }
    .bank-row dd { font-weight: 500; font-size: 0.95rem; color: var(--text); overflow-wrap: anywhere; }
    .bank-row .copy { padding: 6px 14px; }
    .after-pay { font-size: 0.92rem; margin-bottom: 14px; }
    .other { margin-top: 16px; font-size: 0.88rem; color: var(--text-soft); }
    .other a { color: var(--sage-ink); font-weight: 500; text-underline-offset: 3px; }

    /* ── Policy: the refund share is the information, so it leads ── */
    .tiers { list-style: none; border-top: 1px solid var(--sand); }
    .tier { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: baseline; padding: 18px 0; border-bottom: 1px solid var(--sand); }
    .tier-share { font-family: var(--serif); font-size: 2.9rem; font-weight: 300; line-height: 1; letter-spacing: -0.02em; }
    .tier-when { font-weight: 500; color: var(--text); font-size: 0.98rem; line-height: 1.4; }
    .tier-outcome { font-size: 0.92rem; color: var(--text-mid); margin-top: 2px; }
    .rules { margin-top: 22px; display: grid; gap: 10px; }
    .rules p { font-size: 0.92rem; }

    /* ── Locations ── */
    .places { list-style: none; border-top: 1px solid var(--sand); }
    .place { display: flex; justify-content: space-between; align-items: flex-start; gap: 16px; padding: 16px 0; border-bottom: 1px solid var(--sand); }
    .place address { font-style: normal; font-size: 0.9rem; color: var(--text-mid); margin-top: 2px; line-height: 1.55; }
    .place .kind { font-size: 0.78rem; color: var(--text-soft); font-weight: 400; }
    .place:last-child { border-bottom: 0; }
    .place a.dir { flex-shrink: 0; font-size: 0.88rem; font-weight: 500; color: var(--sage-ink); text-underline-offset: 3px; padding-top: 2px; }

    /* ── Elsewhere ── */
    .links { list-style: none; display: grid; gap: 10px; }
    .link-row {
      display: flex; align-items: center; justify-content: space-between; gap: 16px;
      padding: 15px 18px; background: var(--white); border: 1px solid var(--sand); border-radius: 16px;
      text-decoration: none; transition: var(--ease);
    }
    .link-row:hover { background: var(--warm); border-color: var(--text-soft); }
    .link-row strong { display: block; font-weight: 500; font-size: 0.98rem; line-height: 1.3; }
    .link-row span { display: block; font-size: 0.83rem; color: var(--text-soft); }
    .link-row svg { width: 18px; height: 18px; flex-shrink: 0; color: var(--text-soft); }

    /* ── Footer ── */
    footer { margin-top: 56px; padding-top: 32px; border-top: 1px solid var(--sand); font-size: 0.85rem; color: var(--text-soft); }
    footer h2 { font-size: 1.25rem; margin-bottom: 6px; color: var(--text); }
    .help { list-style: none; margin: 12px 0 18px; display: grid; gap: 6px; }
    .help li { display: flex; justify-content: space-between; gap: 16px; }
    .help a { color: var(--text); font-weight: 500; text-underline-offset: 3px; white-space: nowrap; }
    .fine { font-size: 0.8rem; line-height: 1.6; }
    .fine + .fine { margin-top: 10px; }

    .noscript { max-width: 420px; margin: 80px auto; padding: 0 24px; text-align: center; }
    .noscript a { color: var(--sage-ink); }

    @media (max-width: 380px) {
      .page { padding: 36px 18px 64px; }
      .name { font-size: 2.2rem; }
      .tier { grid-template-columns: 78px 1fr; }
      .tier-share { font-size: 2.4rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
  </style>
</head>
<body>

<noscript>
  <p class="noscript">This page needs JavaScript. To book, pay or ask a question, message me on <a href="https://api.whatsapp.com/send?phone=918793318765">WhatsApp</a> or email <a href="mailto:armeet@mindworkscounselling.com">armeet@mindworkscounselling.com</a>.</p>

<div class="page" id="app" aria-live="polite"></div>

<script src="content.js"></script>
<script>
(function () {
  const L = SITE.links;

  /* ── Meta from content.js ── */
  document.title = L.meta.title;
  document.querySelector('meta[name="description"]').content = L.meta.description;
  document.querySelector('meta[property="og:title"]').content = L.meta.title;
  document.querySelector('meta[property="og:description"]').content = L.meta.description;

  /* ── Google Analytics (same property as the main site) ── */
  (function () {
    const id = SITE.googleAnalyticsId;
    if (!id || id === 'G-XXXXXXXXXX') return;
    const s = document.getElementById('ga-script');
    s.src = 'https://www.googletagmanager.com/gtag/js?id=' + id; s.async = true;
    document.getElementById('ga-init').textContent =
      "window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','" + id + "');";
  })();

  /* ── Helpers ── */
  const wa = t => `https://api.whatsapp.com/send?phone=${SITE.whatsapp}&text=${encodeURIComponent(t)}`;
  const WA_ICON = `<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`;
  const DOC_ICON = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h4"/></svg>`;
  const CHEVRON  = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>`;
  const EXTERNAL = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>`;

  const mapsUrl = loc => loc.mapsUrl ||
    'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(loc.name + ', ' + loc.address);

  /* Helplines: "Name: number  |  Name: number" → tappable list */
  const helplines = SITE.footer.helplines.split('|').map(s => s.trim()).filter(Boolean).map(entry => {
    const i = entry.lastIndexOf(':');
    const name = entry.slice(0, i).trim(), num = entry.slice(i + 1).trim();
    return `<li><span>${name}</span><a href="tel:${num.replace(/[^\d+]/g, '')}" data-track="helpline">${num}</a></li>`;
  }).join('');

  const p = L.payment, pol = L.policy, ik = L.intake;
  const hasPayInfo = !!(p.qrImage || p.upiId || p.bank);
  const upiLink = p.upiId
    ? `upi://pay?pa=${p.upiId}${p.upiName ? '&pn=' + encodeURIComponent(p.upiName) : ''}&cu=INR`
    : '';   // QR and/or UPI ID configured?

  /* ── Render ── */
  document.getElementById('app').innerHTML = `
    <header class="head">
      <div class="portrait">
        <picture>
          <source type="image/webp" srcset="images/armeet-480.webp" />
          <img src="images/armeet-480.jpg" alt="Armeet Narang" width="480" height="640" fetchpriority="high"
               onerror="this.closest('.portrait').style.display='none'" />
        </picture>
      </div>
      <h1 class="name">Armeet Narang</h1>
      <p class="role">${L.tagline}</p>
      <p class="intro">${L.intro}</p>
    </header>

    <div class="actions">
      ${L.primaryActions.map(a => `
        <a class="btn btn-${a.style}" href="${wa(a.whatsappText)}" target="_blank" rel="noopener" data-track="${a.label}">
          ${a.icon === 'whatsapp' ? WA_ICON : ''}${a.label}
        </a>`).join('')}
    </div>

    <section aria-labelledby="h-after">
      <h2 id="h-after">After you book</h2>
      <p class="lede">Two things to do so your session is confirmed.</p>
      <ol class="steps">
        <li class="step">
          <span class="step-mark" aria-hidden="true">1</span>
          <h3>${ik.heading}</h3>
          <p>${ik.note}</p>
          <a class="btn btn-sage" href="${ik.url}" target="_blank" rel="noopener" data-track="intake form">${DOC_ICON}${ik.buttonLabel}</a>
        </li>
        <li class="step">
          <span class="step-mark" aria-hidden="true">2</span>
          <h3>${p.heading}</h3>
          <p>${p.note}</p>
          <h3 class="pay-sub">Session fees</h3>
          <ul class="fees">
            ${SITE.fees.items.map(f => `
              <li><span class="fee-name">${f.label}<span class="fee-sub">${f.sublabel}</span></span><span class="fee-amt">${f.amount}</span></li>`).join('')}
          </ul>
          ${hasPayInfo ? '' : `<a class="btn btn-sage pay-details" href="${wa(p.detailsWhatsapp)}" target="_blank" rel="noopener" data-track="payment details">${WA_ICON}${p.detailsLabel}</a>`}
          ${(p.qrImage || p.upiId) ? `<h3 class="pay-sub">Pay by UPI</h3>` : ''}
          ${p.upiId && p.upiAppButton ? `
            <div class="upi-app-wrap" hidden>
              <a class="btn btn-sage" id="upi-app-btn" href="${upiLink}" data-track="pay with upi app">${p.upiAppButton}</a>
              <p>${p.upiAppHint}</p>
            </div>` : ''}
          ${p.qrNote && p.qrImage ? `<p style="margin-bottom:14px;font-size:0.92rem">${p.qrNote}</p>` : ''}
          ${p.qrImage ? `<figure class="qr"><img src="${p.qrImage}" alt="UPI QR code for ${p.upiName || 'payment'}. Scan with any UPI app." width="${p.qrWidth || 800}" height="${p.qrHeight || 1111}" loading="lazy" onerror="this.closest('.qr').remove()" /></figure>` : ''}
          ${p.upiId ? `
            <div class="upi">
              <div>
                <span class="upi-label">UPI ID</span>
                <span class="upi-id">${p.upiId}</span>
                ${p.upiName ? `<span class="upi-name">${p.upiName}</span>` : ''}
              </div>
              <button type="button" class="copy" data-copy="${p.upiId}" aria-label="Copy UPI ID">Copy</button>
            </div>` : ''}
          ${p.bank ? `
            <details class="bank">
              <summary>${p.bank.heading}</summary>
              <dl class="bank-rows">
                <div class="bank-row"><div><dt>Account holder</dt><dd>${p.bank.holder}</dd></div></div>
                <div class="bank-row"><div><dt>Account number</dt><dd>${p.bank.account}</dd></div><button type="button" class="copy" data-copy="${p.bank.account}" aria-label="Copy account number">Copy</button></div>
                <div class="bank-row"><div><dt>IFSC</dt><dd>${p.bank.ifsc}</dd></div><button type="button" class="copy" data-copy="${p.bank.ifsc}" aria-label="Copy IFSC code">Copy</button></div>
                <div class="bank-row"><div><dt>Branch</dt><dd>${p.bank.branch}</dd></div></div>
                <div class="bank-row"><div><dt>Account type</dt><dd>${p.bank.type}</dd></div></div>
              </dl>
            </details>` : ''}
          <p class="after-pay">${p.afterPay}</p>
          <a class="btn btn-outline" href="${wa(p.afterPayWhatsapp)}" target="_blank" rel="noopener" data-track="send screenshot">${WA_ICON}Send payment screenshot</a>
          ${(p.otherMethods) ? `<p class="other">${p.otherMethods} <a href="${wa(p.otherMethodsWhatsapp)}" target="_blank" rel="noopener" data-track="other payment">Message me for the details</a></p>` : ''}
        </li>
      </ol>
    </section>

    <section aria-labelledby="h-policy">
      <h2 id="h-policy">${pol.heading}</h2>
      <p class="lede">What you get back, depending on when you cancel.</p>
      <ul class="tiers">
        ${pol.tiers.map(t => `
          <li class="tier">
            <span class="tier-share">${t.share}</span>
            <div><div class="tier-when">${t.when}</div><div class="tier-outcome">${t.outcome}</div></div>
          </li>`).join('')}
      </ul>
      <div class="rules">${pol.rules.map(r => `<p>${r}</p>`).join('')}</div>
    </section>

    <section aria-labelledby="h-where">
      <h2 id="h-where">Where I see clients</h2>
      <p class="lede">All sessions are by appointment only.</p>
      <ul class="places">
        ${SITE.locations.items.map(loc => {
          const online = loc.type === 'Online';
          return `
          <li class="place">
            <div>
              <span class="kind">${loc.type}</span>
              <h3>${loc.name}</h3>
              <address>${loc.address}</address>
            </div>
            ${online ? '' : `<a class="dir" href="${mapsUrl(loc)}" target="_blank" rel="noopener" data-track="directions: ${loc.name}">Directions</a>`}
          </li>`;
        }).join('')}
      </ul>
    </section>

    <section aria-labelledby="h-else">
      <h2 id="h-else" style="margin-bottom:20px">Elsewhere</h2>
      <ul class="links">
        ${L.elsewhere.map(l => `
          <li><a class="link-row" href="${l.href}"${l.external ? ' target="_blank" rel="noopener"' : ''} data-track="${l.label}">
            <div><strong>${l.label}</strong><span>${l.sub}</span></div>${l.external ? EXTERNAL : CHEVRON}
          </a></li>`).join('')}
      </ul>
    </section>

    <footer>
      <h2>Need support right now?</h2>
      <p class="fine">${L.helplineIntro}</p>
      <ul class="help">${helplines}</ul>
      <p class="fine">${SITE.footer.disclaimer}</p>
      <p class="fine">${SITE.footer.copyright}</p>
    </footer>
  `;

  /* ── UPI app button: phones and tablets only (upi:// does nothing on desktop) ── */
  if (/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)) {
    document.querySelectorAll('.upi-app-wrap').forEach(el => el.hidden = false);
  }

  /* ── Copy UPI ID ── */
  document.addEventListener('click', async e => {
    const btn = e.target.closest('.copy');
    if (!btn) return;
    const text = btn.dataset.copy;
    try { await navigator.clipboard.writeText(text); }
    catch (_) {
      const ta = document.createElement('textarea'); ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (__) {}
      ta.remove();
    }
    btn.textContent = 'Copied';
    setTimeout(() => { btn.textContent = 'Copy'; }, 1800);
  });

  /* ── Analytics: which links get used ── */
  document.addEventListener('click', e => {
    const a = e.target.closest('[data-track]');
    if (a && typeof gtag === 'function') gtag('event', 'links_click', { link: a.dataset.track });
  });
})();
</script>
</body>
</html>
