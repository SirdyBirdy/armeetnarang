  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --cream:     #F9F6F1;
      --warm:      #F2EDE4;
      --sand:      #E8DFD0;
      --sage:      #8FA882;
      --sage-dark: #6B8A5E;
      --text:      #2A2420;
      --text-mid:  #6B5E54;
      --text-soft: #72665D;   /* was #9E9088 (2.7:1). Now passes WCAG AA on cream/warm/white */
      --sage-ink:  #4E6F42;   /* text + button fills on light backgrounds (AA). --sage stays for dots/borders */
      --white:     #FFFFFF;
      --radius:    18px;
      --transition: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }

    html { scroll-behavior: smooth; }
    :focus-visible { outline: 2px solid var(--sage-ink); outline-offset: 3px; border-radius: 6px; }
    .skip-link { position: absolute; left: 12px; top: -60px; z-index: 10000; background: var(--text); color: var(--white); padding: 10px 16px; border-radius: 10px; font-size: 0.85rem; text-decoration: none; transition: top 0.2s; }
    .skip-link:focus { top: 12px; }
    body { font-family: 'DM Sans', sans-serif; background: var(--cream); color: var(--text); overflow-x: hidden; font-size: 16px; line-height: 1.6; }

    .noise::before {
      content: ''; position: absolute; inset: 0; opacity: 0.035; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)'/%3E%3C/svg%3E");
      background-size: 200px 200px; z-index: 0;
    }
    .noise > * { position: relative; z-index: 1; }

    h1, h2, h3, .serif { font-family: 'Cormorant Garamond', serif; }
    h1 { font-size: clamp(3rem, 7vw, 5.5rem); font-weight: 300; line-height: 1.05; letter-spacing: -0.02em; }
    h2 { font-size: clamp(2rem, 4vw, 3.2rem); font-weight: 300; line-height: 1.15; }
    h3 { font-size: 1.5rem; font-weight: 400; }
    p  { font-weight: 300; color: var(--text-mid); line-height: 1.75; }

    .container { max-width: 1100px; margin: 0 auto; padding: 0 32px; }
    section { padding: 100px 0; position: relative; overflow: hidden; }

    /* ── Buttons ── */
    .btn { display: inline-flex; align-items: center; gap: 8px; padding: 14px 28px; border-radius: 100px; font-family: 'DM Sans', sans-serif; font-size: 0.875rem; font-weight: 500; cursor: pointer; text-decoration: none; transition: var(--transition); border: none; }
    .btn-primary { background: var(--text); color: var(--white); }
    .btn-primary:hover { background: #3d3530; transform: translateY(-2px); box-shadow: 0 8px 24px rgba(42,36,32,.18); }
    .btn-outline { background: transparent; color: var(--text); border: 1.5px solid var(--sand); }
    .btn-outline:hover { background: var(--warm); border-color: var(--text-soft); }
    .btn-sage { background: var(--sage-ink); color: var(--white); }
    .btn-sage:hover { background: #3F5C35; transform: translateY(-2px); }
    .whatsapp-icon { width: 18px; height: 18px; flex-shrink: 0; }

    /* ── CRISIS BANNER ── */
    #crisis-banner {
      background: #2A2420;
      padding: 10px 20px;
      text-align: center;
      font-size: 0.82rem;
      color: rgba(255,255,255,0.7);
      position: relative;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    #crisis-banner .crisis-dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--sage); flex-shrink: 0;
      animation: pulse 2.5s ease infinite;
    }
    #crisis-banner a {
      color: var(--sage);
      text-decoration: none;
      font-weight: 500;
      white-space: nowrap;
    }
    #crisis-banner a:hover { color: #a8c49a; }
    #crisis-banner .crisis-dismiss {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      background: none; border: none; color: rgba(255,255,255,0.3);
      cursor: pointer; font-size: 1rem; line-height: 1; padding: 4px;
      transition: color 0.2s;
    }
    #crisis-banner .crisis-dismiss:hover { color: rgba(255,255,255,0.7); }

    /* ── HERO ── */
    #hero { min-height: 100vh; min-height: 100svh; display: flex; align-items: center; background: var(--cream); padding-top: 60px; padding-bottom: 120px; }
    #hero .container { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; }
    .hero-label { display: inline-flex; align-items: center; gap: 8px; background: var(--warm); border: 1px solid var(--sand); padding: 6px 14px; border-radius: 100px; font-size: 0.8rem; color: var(--text-mid); margin-bottom: 28px; }
    .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sage); flex-shrink: 0; animation: pulse 2.5s ease infinite; }
    @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(0.85)} }
    .hero-title { margin-bottom: 24px; color: var(--text); }
    .hero-title em { font-style: italic; color: var(--sage-dark); }
    .hero-sub { font-size: 1.05rem; max-width: 440px; margin-bottom: 40px; color: var(--text-mid); }
    .hero-cta { display: flex; gap: 14px; flex-wrap: wrap; }
    .hero-image-wrap { position: relative; display: flex; justify-content: center; }
    .hero-image-card { width: 380px; height: 480px; border-radius: 200px 200px 180px 180px; background: var(--warm); border: 1px solid var(--sand); overflow: hidden; position: relative; }
    .hero-image-card picture { display: block; width: 100%; height: 100%; }
    .hero-image-card img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block; }
    .hero-image-card .placeholder-portrait { width: 100%; height: 100%; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 40px; background: linear-gradient(160deg, #EDE8DF 0%, #D4C9B8 100%); }
    .portrait-initials { font-family: 'Cormorant Garamond', serif; font-size: 7rem; font-weight: 300; color: rgba(42,36,32,0.12); letter-spacing: -0.04em; line-height: 1; }
    .hero-badge { position: absolute; bottom: 24px; right: -16px; background: var(--white); border: 1px solid var(--sand); border-radius: 16px; padding: 16px 20px; box-shadow: 0 8px 32px rgba(0,0,0,0.06); }
    .hero-badge .badge-num { font-family: 'Cormorant Garamond', serif; font-size: 2rem; font-weight: 500; color: var(--text); line-height: 1; }
    .hero-badge .badge-label { font-size: 0.75rem; color: var(--text-soft); margin-top: 2px; }

    /* ── ABOUT ── */
    #about { background: var(--warm); }
    #about .container { display: grid; grid-template-columns: 1fr 1.4fr; gap: 80px; align-items: start; }
    .about-sticky { position: sticky; top: 120px; }
    .about-tag { font-size: 0.78rem; letter-spacing: 0.1em; text-transform: uppercase; color: var(--sage-ink); margin-bottom: 16px; font-weight: 500; }
    .about-lead { font-family: 'Cormorant Garamond', serif; font-size: clamp(1.5rem, 2.8vw, 2rem); font-weight: 300; line-height: 1.35; color: var(--text); margin-bottom: 28px; font-style: italic; }
    .credentials { display: flex; flex-direction: column; gap: 12px; margin-bottom: 32px; }
    .cred-item { display: flex; align-items: center; gap: 12px; background: var(--white); border: 1px solid var(--sand); border-radius: 12px; padding: 12px 16px; }
    .cred-icon { font-size: 1.2rem; }
    .cred-text { font-size: 0.875rem; color: var(--text); }
    .cred-text span { display: block; color: var(--text-soft); font-size: 0.78rem; }
    .about-body p { margin-bottom: 20px; font-size: 1rem; }
    .about-therapies { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 28px; }
    .therapy-pill { background: var(--white); border: 1px solid var(--sand); padding: 6px 14px; border-radius: 100px; font-size: 0.8rem; color: var(--text-mid); }
    .about-links { display: flex; gap: 10px; flex-wrap: wrap; }

    /* ── SPECIALTIES ── */
    #specialties { background: var(--cream); }
    .section-header { text-align: center; margin-bottom: 64px; }
    .section-header p { max-width: 520px; margin: 16px auto 0; }
    .specialties-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; }
    .specialty-card { background: var(--white); border: 1px solid var(--sand); border-radius: var(--radius); padding: 32px 28px; transition: var(--transition); position: relative; overflow: hidden; }
    .specialty-card::after { content: ''; position: absolute; bottom: 0; left: 0; right: 0; height: 3px; background: var(--sage); transform: scaleX(0); transform-origin: left; transition: var(--transition); }
    .specialty-card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.07); border-color: var(--sage); }
    .specialty-card:hover::after { transform: scaleX(1); }
    .specialty-icon { font-size: 1.8rem; margin-bottom: 16px; display: block; }
    .specialty-card h3 { font-family: 'Cormorant Garamond', serif; font-size: 1.2rem; font-weight: 500; margin-bottom: 10px; color: var(--text); }
    .specialty-card p { font-size: 0.875rem; line-height: 1.65; }

    /* ── LOCATIONS ── */
    #locations { background: var(--warm); }
    .locations-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 56px; }
    .locations-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; }
    .location-card { background: var(--white); border: 1px solid var(--sand); border-radius: var(--radius); padding: 28px; display: flex; flex-direction: column; gap: 12px; transition: var(--transition); }
    .location-card:hover { transform: translateY(-3px); box-shadow: 0 12px 40px rgba(0,0,0,0.06); }
    .location-tag { display: inline-flex; align-items: center; gap: 6px; background: var(--warm); padding: 4px 10px; border-radius: 100px; font-size: 0.75rem; color: var(--sage-ink); font-weight: 500; width: fit-content; }
    .location-card h3 { font-size: 1.1rem; font-family: 'DM Sans', sans-serif; font-weight: 500; color: var(--text); }
    .location-card address { font-style: normal; font-size: 0.85rem; color: var(--text-soft); line-height: 1.55; }
    .location-card .btn { margin-top: 4px; align-self: flex-start; font-size: 0.8rem; padding: 10px 18px; }
    .location-note { margin-top: 40px; background: var(--cream); border: 1px solid var(--sand); border-radius: 14px; padding: 20px 24px; font-size: 0.875rem; color: var(--text-mid); display: flex; align-items: flex-start; gap: 12px; }
    .note-icon { font-size: 1.2rem; flex-shrink: 0; margin-top: 1px; }

    /* ── FEES ── */
    #fees { background: var(--cream); }
    .fees-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 32px; }
    .fee-card {
      background: var(--white); border: 1px solid var(--sand);
      border-radius: var(--radius); padding: 32px 28px;
      display: flex; flex-direction: column; gap: 8px;
      transition: var(--transition); position: relative; overflow: hidden;
    }
    .fee-card:hover { transform: translateY(-4px); box-shadow: 0 16px 48px rgba(0,0,0,0.07); border-color: var(--sage); }
    .fee-card.highlighted {
      border-color: var(--sage);
      box-shadow: 0 0 0 1px var(--sage);
    }
    .fee-card.highlighted::after {
      content: 'Most popular'; position: absolute; top: 16px; right: 16px;
      background: var(--sage-ink); color: var(--white);
      font-size: 0.7rem; font-weight: 500; letter-spacing: 0.05em;
      padding: 3px 10px; border-radius: 100px;
    }
    .fee-card.highlighted:hover { box-shadow: 0 16px 48px rgba(143,168,130,0.2), 0 0 0 1px var(--sage); }
    .fee-label   { font-size: 0.78rem; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-soft); font-weight: 500; }
    .fee-sublabel { font-size: 0.82rem; color: var(--text-mid); margin-bottom: 8px; }
    .fee-amount  { font-family: 'Cormorant Garamond', serif; font-size: 3rem; font-weight: 300; color: var(--text); line-height: 1; margin: 4px 0; }
    .fee-note    { font-size: 0.82rem; color: var(--text-soft); line-height: 1.55; }
    .fees-footnote {
      background: var(--warm); border: 1px solid var(--sand);
      border-radius: 14px; padding: 20px 24px;
      font-size: 0.875rem; color: var(--text-mid);
      display: flex; align-items: flex-start; gap: 12px;
      margin-bottom: 32px;
    }
    .fees-cta { text-align: center; }

    /* ── REVIEWS ── */
    #reviews { background: var(--warm); }
    .reviews-header { text-align: center; margin-bottom: 56px; }
    .reviews-header p { max-width: 400px; margin: 12px auto 0; }
    .reviews-track { display: flex; gap: 20px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; padding-bottom: 16px; cursor: grab; }
    .reviews-track:active { cursor: grabbing; }
    .reviews-track::-webkit-scrollbar { height: 4px; }
    .reviews-track::-webkit-scrollbar-track { background: var(--sand); border-radius: 4px; }
    .reviews-track::-webkit-scrollbar-thumb { background: var(--text-soft); border-radius: 4px; }
    .review-card { flex: 0 0 320px; scroll-snap-align: start; background: var(--white); border: 1px solid var(--sand); border-radius: var(--radius); padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; }
    .review-source { display: flex; align-items: center; gap: 8px; font-size: 0.75rem; font-weight: 500; color: var(--text-soft); letter-spacing: 0.05em; text-transform: uppercase; }
    .review-source-dot { width: 8px; height: 8px; border-radius: 50%; }
    .review-source-dot.google { background: #4285F4; }
    .review-source-dot.practo { background: #3CA85A; }
    .review-stars { color: #E8A838; font-size: 0.9rem; letter-spacing: 1px; }
    .review-text { font-size: 0.9rem; line-height: 1.7; color: var(--text-mid); flex: 1; }
    .review-reviewer { font-size: 0.8rem; color: var(--text-soft); padding-top: 8px; border-top: 1px solid var(--sand); margin-top: auto; }
    .reviews-links { display: flex; gap: 14px; justify-content: center; margin-top: 40px; flex-wrap: wrap; }

    /* ── QUEERKEY ── */
    #queerkey {
      background: linear-gradient(140deg, #1C1528 0%, #2A1F3D 50%, #1E2635 100%);
      position: relative;
      overflow: hidden;
    }
    #queerkey::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 60% 50% at 80% 20%, rgba(180,130,220,0.08) 0%, transparent 60%),
        radial-gradient(ellipse 40% 60% at 10% 80%, rgba(100,160,210,0.07) 0%, transparent 55%);
      pointer-events: none;
    }
    #queerkey .container { display: grid; grid-template-columns: 1fr 1fr; gap: 80px; align-items: center; position: relative; z-index: 1; }
    #queerkey h2 { color: var(--white); }
    #queerkey p { color: rgba(255,255,255,0.65); }
    .queerkey-tag {
      background: rgba(180,130,220,0.15);
      border: 1px solid rgba(180,130,220,0.25);
      color: rgba(200,165,230,0.9);
      padding: 5px 12px; border-radius: 100px;
      font-size: 0.78rem; letter-spacing: 0.06em; text-transform: uppercase;
      display: inline-block; margin-bottom: 20px;
    }
    .queerkey-desc { margin: 20px 0 36px; }
    .queerkey-features { display: flex; flex-direction: column; gap: 16px; }
    .qk-feature {
      display: flex; gap: 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.09);
      border-radius: 14px; padding: 18px 20px; align-items: flex-start;
      transition: border-color 0.3s, background 0.3s;
    }
    .qk-feature:hover {
      background: rgba(180,130,220,0.07);
      border-color: rgba(180,130,220,0.2);
    }
    .qk-feature-icon {
      flex-shrink: 0; margin-top: 2px;
      color: rgba(200,165,230,0.85);
      display: flex; align-items: center;
    }
    .qk-feature-icon svg { stroke: rgba(200,165,230,0.85); }
    .qk-feature-text strong { display: block; font-size: 0.9rem; color: rgba(255,255,255,0.9); font-weight: 500; margin-bottom: 4px; }
    .qk-feature-text p { font-size: 0.82rem; color: rgba(255,255,255,0.5); margin: 0; }

    /* ── INSTAGRAM ── */
    #instagram { background: var(--cream); }
    .instagram-intro { text-align: center; margin-bottom: 48px; }
    .instagram-intro p { max-width: 480px; margin: 12px auto 0; }
    .ig-handle { display: inline-flex; align-items: center; gap: 8px; background: var(--warm); border: 1px solid var(--sand); padding: 8px 16px; border-radius: 100px; font-size: 0.85rem; color: var(--text); text-decoration: none; margin-top: 20px; transition: var(--transition); }
    .ig-handle:hover { background: var(--sand); }
    .ig-reels-track { display: flex; gap: 16px; overflow-x: auto; scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; padding-bottom: 16px; }
    .ig-reels-track::-webkit-scrollbar { height: 4px; }
    .ig-reels-track::-webkit-scrollbar-track { background: var(--sand); border-radius: 4px; }
    .ig-reels-track::-webkit-scrollbar-thumb { background: var(--text-soft); border-radius: 4px; }
    .ig-reel-card { flex: 0 0 328px; scroll-snap-align: start; background: var(--warm); border: 1px solid var(--sand); border-radius: 16px; overflow: hidden; display: flex; align-items: flex-start; justify-content: center; min-height: 580px; }
    .ig-reel-card blockquote.instagram-media { margin: 0 !important; min-width: unset !important; width: 100% !important; height: 100% !important; }
    .ig-embed-placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; text-align: center; background: linear-gradient(160deg, var(--warm) 0%, var(--sand) 100%); }
    .ig-embed-placeholder .ig-icon { font-size: 2.5rem; opacity: 0.4; }
    .ig-embed-placeholder p { font-size: 0.8rem; color: var(--text-soft); }
    .ig-note { text-align: center; margin-top: 32px; font-size: 0.85rem; color: var(--text-soft); }
    .ig-note code { background: var(--warm); padding: 2px 6px; border-radius: 4px; font-size: 0.8rem; }

    /* ── FAQ ── */
    #faq { background: var(--warm); }
    .faq-list { display: flex; flex-direction: column; gap: 12px; max-width: 780px; margin: 0 auto; }
    .faq-item {
      background: var(--white); border: 1px solid var(--sand);
      border-radius: 16px; overflow: hidden;
      transition: border-color 0.2s;
    }
    .faq-item.open { border-color: var(--sage); box-shadow: 0 0 0 1px var(--sage); border-left: 3px solid var(--sage); }
    .faq-question {
      display: flex; justify-content: space-between; align-items: center;
      padding: 22px 24px; cursor: pointer;
      font-size: 0.975rem; font-weight: 400; color: var(--text);
      gap: 16px; user-select: none;
      background: none; border: none; width: 100%; text-align: left;
      transition: background 0.2s;
    }
    .faq-question:hover { background: var(--warm); }
    .faq-item.open .faq-question { background: var(--white); }
    .faq-icon {
      flex-shrink: 0; width: 28px; height: 28px;
      border-radius: 50%; background: var(--warm);

function toggleFaq(i) {
  const item = document.getElementById(`faq-item-${i}`);
  const btn  = item.querySelector('.faq-question');
  const isOpen = item.classList.contains('open');
  // Close all
  document.querySelectorAll('.faq-item.open').forEach(el => {
    el.classList.remove('open');
    el.querySelector('.faq-question').setAttribute('aria-expanded','false');
  });
  // Open this one if it was closed
  if (!isOpen) {
    item.classList.add('open');
    btn.setAttribute('aria-expanded','true');
  }
}

/* ── Nav Island ── */
let navOpen = false;
function toggleNav() {
  navOpen = !navOpen;
  document.getElementById('navMenu').classList.toggle('open', navOpen);
  document.getElementById('nav-island').classList.toggle('nav-island-open', navOpen);
  const pill = document.getElementById('navPill');
  pill.setAttribute('aria-expanded', navOpen);
  pill.setAttribute('aria-label', navOpen ? 'Close menu' : 'Open menu');
}
function closeNav() {
  navOpen = false;
  document.getElementById('navMenu').classList.remove('open');
  document.getElementById('nav-island').classList.remove('nav-island-open');
  const pill = document.getElementById('navPill');
  pill.setAttribute('aria-expanded', false);
  pill.setAttribute('aria-label', 'Open menu');
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && navOpen) { closeNav(); document.getElementById('navPill').focus(); } });
document.addEventListener('click', e => {
  if (navOpen && !document.getElementById('nav-island').contains(e.target)) closeNav();
});

/* ── Scroll Animations ── */
const observer = new IntersectionObserver(entries => {
  entries.forEach(e => { if (e.isIntersecting) { e.target.classList.add('visible'); observer.unobserve(e.target); } });
}, { threshold: 0.1, rootMargin: '0px 0px -48px 0px' });

function observeFaders() {
  document.querySelectorAll('.fade-up:not([data-obs])').forEach(el => { el.dataset.obs='1'; observer.observe(el); });
}
observeFaders();
setTimeout(observeFaders, 120);

/* ── Discovery Call Tooltips ──
   After all content is rendered, find every text node containing
   "discovery call" (case-insensitive) and append an ⓘ icon with
   a hover/focus tooltip explaining what it is.
──────────────────────────────── */
(function() {
  var TOOLTIP_TEXT = "A free 15-minute conversation. No assessment, no commitment. Just a chance to ask questions, see if the approach feels right, and decide whether you'd like to go ahead.";
  var RE = /(free discovery call|discovery call)/gi;

  function makeIconNode() {
    var icon = document.createElement('span');
    icon.className = 'dc-info-icon';
    icon.setAttribute('tabindex', '0');
    icon.setAttribute('role', 'img');
    icon.setAttribute('aria-label', 'What is a discovery call?');
    icon.textContent = 'i';
    var tip = document.createElement('span');
    tip.className = 'dc-tooltip-box';
    tip.textContent = TOOLTIP_TEXT;
    icon.appendChild(tip);
    return icon;
  }

  function wrapTextNode(node) {
    var text = node.nodeValue;
    RE.lastIndex = 0;
    if (!RE.test(text)) return;
    RE.lastIndex = 0;
    var frag = document.createDocumentFragment();
    var last = 0, m;
    while ((m = RE.exec(text)) !== null) {
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      var wrap = document.createElement('span');
      wrap.className = 'dc-tooltip-wrap';
      wrap.appendChild(document.createTextNode(m[0]));
      wrap.appendChild(makeIconNode());
      frag.appendChild(wrap);
      last = RE.lastIndex;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }

  function walkAndWrap(root) {
    var skipTags = {SCRIPT:1, STYLE:1, TEXTAREA:1, CODE:1};
    var walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT, {
      acceptNode: function(node) {
        var p = node.parentElement;
        if (!p) return NodeFilter.FILTER_REJECT;
        if (skipTags[p.tagName]) return NodeFilter.FILTER_REJECT;
        if (p.closest && p.closest('.dc-tooltip-box, .dc-tooltip-wrap')) return NodeFilter.FILTER_REJECT;
        RE.lastIndex = 0;
        if (RE.test(node.nodeValue)) { RE.lastIndex = 0; return NodeFilter.FILTER_ACCEPT; }
        return NodeFilter.FILTER_SKIP;
      }
    });
    var nodes = [];
    var n;
    while ((n = walker.nextNode())) nodes.push(n);
    nodes.forEach(wrapTextNode);
  }

  // Only inject on: hero CTA button (top) + booking CTA button (bottom)
  // We target the specific rendered <a> buttons by their parent container IDs
  function addIconToButton(containerEl) {
    if (!containerEl) return;
    var links = containerEl.querySelectorAll('a.btn');
    links.forEach(function(link) {
      RE.lastIndex = 0;
      if (!RE.test(link.textContent)) return;
      RE.lastIndex = 0;
      // Find the text node with "discovery call"
      var childNodes = Array.prototype.slice.call(link.childNodes);
      childNodes.forEach(function(child) {
        if (child.nodeType !== Node.TEXT_NODE) return;
        RE.lastIndex = 0;
        if (!RE.test(child.nodeValue)) return;
        RE.lastIndex = 0;
        var text = child.nodeValue;
        var frag = document.createDocumentFragment();
        var last = 0, m;
        while ((m = RE.exec(text)) !== null) {
          if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
          var wrap = document.createElement('span');
          wrap.className = 'dc-tooltip-wrap';
          wrap.appendChild(document.createTextNode(m[0]));
          wrap.appendChild(makeIconNode());
          frag.appendChild(wrap);
          last = RE.lastIndex;
        }
        if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
        child.parentNode.replaceChild(frag, child);
      });
    });
  }

  setTimeout(function() {
    addIconToButton(document.getElementById('hero-cta'));    // top
    addIconToButton(document.getElementById('book-ctas'));   // bottom
  }, 80);
})();
</script>
