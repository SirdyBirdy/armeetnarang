# Netlify config for armeetnarang.com
# The site lives at the repo root, so the whole repo is published.

[build]
  publish = "."

# Serve links.html at /links (no ".html" in the shared URL)
[[redirects]]
  from   = "/links"
  to     = "/links.html"
  status = 200

# /links/ (trailing slash) -> /links, so relative file paths keep working
[[redirects]]
  from   = "/links/"
  to     = "/links"
  status = 301

# Repo housekeeping files are not part of the site
[[redirects]]
  from   = "/netlify.toml"
  to     = "/404.html"
  status = 404
  force  = true

[[redirects]]
  from   = "/README.md"
  to     = "/404.html"
  status = 404
  force  = true

# Security headers on every page
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"

# HTML, JS and the manifest must always revalidate, so edits go live immediately after a deploy
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Images change rarely: cache for a day
[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
